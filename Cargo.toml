[package]
name = "archive-vfs-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Vadym Stupakov <vadim.stupakov@gmail.com>"]
description = "Read-only archive backend for the archive-vfs.yazi plugin"
license = "MIT"
repository = "https://github.com/Red-Eyed/archive-vfs.yazi"
keywords = ["archive", "vfs", "yazi", "zip", "zip64"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.5"
directories = "6.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
oem_cp = "2.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.7"
predicates = "3.1"
tempfile = "3.21"
zip = { version = "5.1", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
